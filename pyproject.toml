[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-debt-collection-engine"
version = "0.1.0"
description = "Scaffold for a synthetic, explainable debt-collection workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yottaflex-debt-collection = "yottaflex_debt_collection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
