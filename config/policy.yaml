policy_version: 2
description: >-
  Example decision policy for synthetic data and workflow demonstrations.
  Validate this configuration with compliance counsel and approved organizational
  policy before production use.

rules:
  R-CONTACT-01:
    desc: No contact outside 08:00-19:00 customer local time.
    start_local: "08:00"
    end_local: "19:00"
    timezone_source: contact_preference.timezone
  R-CONTACT-02:
    desc: Maximum 3 sent attempts or reserved scheduled contact tasks per rolling 7 days per account.
    max_attempts: 3
    period_days: 7
    scope: account
    scheduled_contacts_count_toward_cap: true
  R-CONTACT-03:
    desc: Allowed synthetic contact outcomes follow the documented immutable case-sequence cycle, independently of latent behavior labels.
    case_sequence_cycle:
      - connected
      - connected
      - connected
      - connected
      - connected
      - voicemail
      - voicemail
      - no_answer
      - no_answer
      - refused
  R-PROMISE-01:
    desc: Connected contacts may create a promise for the configured share of arrears verified on the promise date.
    amount_percent_of_arrears: 70
    promise_due_days: 7
  R-DISPUTE-01:
    desc: Disputed debt suppresses dunning and routes the case to review.
    statuses: [disputed, under_review]
    suppress_dunning: true
    route_to_review: true
  R-HARDSHIP-01:
    desc: Requested or approved hardship pauses automated outbound contact pending review.
    statuses: [requested, approved]
    pause_outbound_contact: true
    pause_automated_escalation: true
    approved_arrangement_requires_review_to_release: true
  R-CEASE-01:
    desc: A cease-contact instruction blocks outbound contact and routes the account for compliance review.
    block_outbound_contact: true
    route_to_review: true
  R-PAIDOFF-01:
    desc: Paid-off loans are excluded from collection; a remaining open case is flagged for review.
    exclude_paid_off_loans: true
    flag_open_case: true
  R-ALLOC-01:
    desc: Posted payments allocate to oldest due eligible installments first, allowing partial allocation.
    rule: oldest_due_first
    eligible_payment_statuses: [posted]
    allow_partial_allocation: true
    tie_breakers: [due_date, loan_id, sequence_number]
  R-SCORE-01:
    desc: Priority score is an explainable weighted sum of balance, delinquency age, and risk.
  R-CASE-01:
    desc: Open one collection case when DPD first reaches the configured threshold.
    dpd_threshold: 1
  R-RECON-01:
    desc: Payment commitment reconciliation allows configured amount tolerance and grace period.

suppression:
  first_match_order:
    - R-PAIDOFF-01
    - R-DISPUTE-01
    - R-HARDSHIP-01
    - R-CEASE-01
  disposition:
    R-PAIDOFF-01: resolved
    R-DISPUTE-01: paused
    R-HARDSHIP-01: paused
    R-CEASE-01: paused

scoring:
  scale: {minimum: 0, maximum: 100}
  w_balance: 0.40
  w_age: 0.35
  w_risk: 0.25
  balance_normalization: min(arrears_amount / loan.principal_amount, 1)
  age_normalization: dpd_bucket_score / 100
  risk_normalization: customer_risk_score / 100
  evaluation_date: fixed_as_of_date
  tiers:
    p1_min_score: 70
    p2_min_score: 40
  balance_reason_thresholds:
    medium_min: 0.25
    high_min: 0.75
  reason_codes:
    case_open: CASE_DPD_THRESHOLD_CROSSED
    balance_low: BALANCE_LOW
    balance_medium: BALANCE_MEDIUM
    balance_high: BALANCE_HIGH
    age_prefix: AGE_
    risk_prefix: RISK_
  dpd_buckets:
    - {name: current, min_days: 0, max_days: 0, score: 0}
    - {name: 1_30_days, min_days: 1, max_days: 30, score: 25}
    - {name: 31_60_days, min_days: 31, max_days: 60, score: 50}
    - {name: 61_90_days, min_days: 61, max_days: 90, score: 75}
    - {name: over_90_days, min_days: 91, max_days: null, score: 100}
  formula: >-
    100 * (0.40 * normalized arrears balance + 0.35 * normalized DPD bucket
    score + 0.25 * normalized customer risk score); weights must sum to 1.

reconcile:
  tolerance_pct: 5
  grace_days: 2
  outcomes:
    kept: Sum of eligible posted payments is at least promised amount times (1 - tolerance_pct / 100).
    partial: Sum is greater than zero but below the kept threshold after the grace period.
    broken: No eligible posted payment exists after the grace period.
