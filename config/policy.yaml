policy_version: 2
description: >-
  Example decision policy for synthetic data and workflow demonstrations.
  Validate this configuration with compliance counsel and approved organizational
  policy before production use.

rules:
  R-CONTACT-01:
    desc: No contact outside 08:00-19:00 customer local time.
    start_local: "08:00"
    end_local: "19:00"
    timezone_source: contact_preference.timezone
  R-CONTACT-02:
    desc: Maximum 3 sent contact attempts per rolling 7 days per account.
    max_attempts: 3
    period_days: 7
    scope: account
  R-DISPUTE-01:
    desc: Disputed debt suppresses dunning and routes the case to review.
    statuses: [disputed, under_review]
    suppress_dunning: true
    route_to_review: true
  R-HARDSHIP-01:
    desc: Requested or approved hardship pauses automated outbound contact pending review.
    statuses: [requested, approved]
    pause_outbound_contact: true
    pause_automated_escalation: true
    approved_arrangement_requires_review_to_release: true
  R-CEASE-01:
    desc: A cease-contact instruction blocks outbound contact and routes the account for compliance review.
    block_outbound_contact: true
    route_to_review: true
  R-PAIDOFF-01:
    desc: Paid-off loans are excluded from collection; a remaining open case is flagged for review.
    exclude_paid_off_loans: true
    flag_open_case: true
  R-ALLOC-01:
    desc: Posted payments allocate to oldest due eligible installments first, allowing partial allocation.
    rule: oldest_due_first
    eligible_payment_statuses: [posted]
    allow_partial_allocation: true
    tie_breakers: [due_date, loan_id, sequence_number]
  R-SCORE-01:
    desc: Priority score is an explainable weighted sum of balance, delinquency age, and risk.
  R-RECON-01:
    desc: Payment commitment reconciliation allows configured amount tolerance and grace period.

scoring:
  scale: {minimum: 0, maximum: 100}
  w_balance: 0.40
  w_age: 0.35
  w_risk: 0.25
  dpd_buckets:
    - {name: current, min_days: 0, max_days: 0, score: 0}
    - {name: 1_30_days, min_days: 1, max_days: 30, score: 25}
    - {name: 31_60_days, min_days: 31, max_days: 60, score: 50}
    - {name: 61_90_days, min_days: 61, max_days: 90, score: 75}
    - {name: over_90_days, min_days: 91, max_days: null, score: 100}
  formula: >-
    weighted sum of normalized arrears balance, DPD bucket score, and risk score,
    clamped to 0-100; weights must sum to 1.

reconcile:
  tolerance_pct: 5
  grace_days: 2
