- name: dispute
  description: Synthetic dispute record for a customer account and affected loan.
  fields:
    dispute_id:
      name: dispute_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: none
      unique: true
      validation: Must match DIS-2026- followed by a six-digit zero-padded counter.
      primary_key: true
      sql_check: dispute_id ~ '^DIS-2026-[0-9]{6}$'
    account_id:
      name: account_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: none
      unique: false
      validation: Must reference the affected account.
      references:
        table: account
        field: account_id
        on_delete: RESTRICT
    loan_id:
      name: loan_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: none
      unique: false
      validation: Must reference the loan subject to the dispute.
      references:
        table: loan
        field: loan_id
        on_delete: RESTRICT
    filed_at:
      name: filed_at
      type: TIMESTAMPTZ
      required: true
      allowed_values: []
      unit: UTC timestamp
      unique: false
      validation: Must not precede the account opening date or exceed the fixed as-of date.
    reason_code:
      name: reason_code
      type: VARCHAR(32)
      required: true
      allowed_values:
      - balance_question
      - payment_not_posted
      - identity_question
      unit: none
      unique: false
      validation: Must identify a supported synthetic dispute reason.
    status:
      name: status
      type: VARCHAR(16)
      required: true
      allowed_values:
      - under_review
      - resolved
      - withdrawn
      unit: none
      unique: false
      validation: Must be under_review, resolved, or withdrawn.
    resolved_at:
      name: resolved_at
      type: TIMESTAMPTZ
      required: false
      allowed_values: []
      unit: UTC timestamp
      unique: false
      validation: Required for resolved or withdrawn records and must not precede filed_at.
    created_at:
      name: created_at
      type: TIMESTAMPTZ
      required: true
      allowed_values: []
      unit: UTC timestamp
      unique: false
      validation: Must use the fixed generation timestamp.
  constraints:
  - name: dispute_resolution_state
    check: (status = 'under_review') = (resolved_at IS NULL)
  - name: dispute_resolution_order
    check: resolved_at IS NULL OR resolved_at >= filed_at
