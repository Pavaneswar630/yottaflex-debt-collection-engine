- name: case_state_history
  description: Append-only record of collection case lifecycle transitions.
  fields:
    state_event_id:
      name: state_event_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: none
      unique: true
      validation: Must match CSH- followed by a six-digit zero-padded counter.
      primary_key: true
      sql_check: state_event_id ~ '^CSH-[0-9]{6}$'
    case_id:
      name: case_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: none
      unique: false
      validation: References the collection case whose state changed.
      references:
        table: collection_case
        field: case_id
        on_delete: RESTRICT
    previous_status:
      name: previous_status
      type: VARCHAR(16)
      required: false
      allowed_values:
      - open
      - paused
      - resolved
      - closed
      unit: none
      unique: false
      validation: When present, must be the state before this transition.
    new_status:
      name: new_status
      type: VARCHAR(16)
      required: true
      allowed_values:
      - open
      - paused
      - resolved
      - closed
      unit: none
      unique: false
      validation: Must be a valid collection case lifecycle state.
    changed_at:
      name: changed_at
      type: TIMESTAMPTZ
      required: true
      allowed_values: []
      unit: UTC timestamp
      unique: false
      validation: Must be a valid transition timestamp.
    reason_code:
      name: reason_code
      type: VARCHAR(40)
      required: true
      allowed_values: []
      unit: none
      unique: false
      validation: Must be a non-empty reason code.
    actor_type:
      name: actor_type
      type: VARCHAR(24)
      required: true
      allowed_values:
      - system
      - operations_analyst
      - compliance_reviewer
      - administrator
      unit: none
      unique: false
      validation: Must identify the actor responsible for the transition.
- name: decision_log
  description: Append-only explainability log for policy decisions and exceptions.
  fields:
    decision_id:
      name: decision_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: none
      unique: true
      validation: Must match DEC-2026- followed by a six-digit zero-padded counter.
      primary_key: true
      sql_check: decision_id ~ '^DEC-2026-[0-9]{6}$'
    case_id:
      name: case_id
      type: VARCHAR(32)
      required: false
      allowed_values: []
      unit: none
      unique: false
      validation: When present, references the affected collection case.
      references:
        table: collection_case
        field: case_id
        on_delete: RESTRICT
    loan_id:
      name: loan_id
      type: VARCHAR(32)
      required: false
      allowed_values: []
      unit: none
      unique: false
      validation: When present, references the affected loan.
      references:
        table: loan
        field: loan_id
        on_delete: RESTRICT
    rule_id:
      name: rule_id
      type: VARCHAR(32)
      required: true
      allowed_values: []
      unit: policy rule identifier
      unique: false
      validation: Must reference a configured rule identifier such as R-CONTACT-01.
    decision_type:
      name: decision_type
      type: VARCHAR(32)
      required: true
      allowed_values:
      - prioritize
      - contact_allowed
      - contact_blocked
      - route_to_review
      - close_paid_case
      - reconcile_promise
      unit: none
      unique: false
      validation: Must be a supported decision type.
    outcome:
      name: outcome
      type: VARCHAR(16)
      required: true
      allowed_values:
      - allow
      - block
      - review
      - close
      - reconcile
      unit: none
      unique: false
      validation: Must record the selected decision outcome.
    reason:
      name: reason
      type: TEXT
      required: true
      allowed_values: []
      unit: none
      unique: false
      validation: Must explain the decision and relevant exception facts.
    priority_score:
      name: priority_score
      type: NUMERIC(5,2)
      required: false
      allowed_values: []
      unit: points (0-100)
      unique: false
      validation: When present, must be within 0 to 100.
      sql_check: priority_score IS NULL OR priority_score BETWEEN 0 AND 100
    as_of_date:
      name: as_of_date
      type: DATE
      required: true
      allowed_values: []
      unit: calendar date
      unique: false
      validation: Must be the fixed evaluation as-of date.
    created_at:
      name: created_at
      type: TIMESTAMPTZ
      required: true
      allowed_values: []
      unit: UTC timestamp
      unique: false
      validation: Must be a valid timestamp with timezone.
